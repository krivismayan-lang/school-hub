<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>School AI Hub & Game Creator 🚀</title>
  <style>
    body { background: #121212; color: #e0e0e0; font-family: system-ui, sans-serif; margin: 0; padding: 20px; }
    .header { border-bottom: 1px solid #292929; padding-bottom: 15px; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 26px; color: #fff; text-align: center; }
    .container { display: flex; gap: 20px; height: 80vh; }
    .panel { flex: 1; display: flex; flex-direction: column; background: #1e1e1e; border: 1px solid #2d2d2d; border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    h2 { margin-top: 0; font-size: 18px; color: #007acc; text-transform: uppercase; }
    textarea { flex: 1; background: #181818; color: #00ff66; border: 1px solid #333; border-radius: 8px; padding: 15px; font-family: monospace; font-size: 14px; resize: none; outline: none; }
    button { background: #007acc; color: #fff; border: none; border-radius: 8px; padding: 14px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    button:hover { background: #005999; }
    iframe { flex: 1; background: #fff; border: none; border-radius: 8px; }
    .ai-link { display: block; text-align: center; margin-top: 10px; color: #4caf50; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🚀 School AI Hub & Game Creator 🚀</h1>
  </div>
  <div class="container">
    <!-- LEFT SIDE: CODE EDITOR -->
    <div class="panel">
      <h2>1. Create Your Game or App</h2>
      <textarea id="code" placeholder="<!-- Ask the AI to write a game (like Snake or Pong) in HTML, then copy and paste the code here! -->"></textarea>
      <button onclick="document.getElementById('view').srcdoc=document.getElementById('code').value">▶ Run App / Play Game</button>
    </div>
    <!-- RIGHT SIDE: LIVE PREVIEW -->
    <div class="panel">
      <h2>2. Live Sandbox Preview</h2>
      <iframe id="view"></iframe>
    </div>
  </div>
</body>
</html>
