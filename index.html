<head>
  <!-- 1. INTENTIONAL PRE-FETCH CODES -->
  <!-- Establishes an ultra-fast background highway network line to your assets before the text even loads -->
  <link rel="dns-prefetch" href="https://githubusercontent.com">
  <link rel="preconnect" href="https://githubusercontent.com" crossorigin>

  <!-- 2. FORCE INTUITIVE CHROMEBOOK RENDERING -->
  <!-- Prevents the Chromebook chip from wasting power recalculating visual sizes as elements load -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 3. INBOUND IMMUTABLE CACHE CONTROLS -->
  <!-- Instructs the Chromebook browser to save this file locally for 1 year. -->
  <!-- It will load instantly (in 0.1 seconds) because it reads directly from the device's storage instead of over the slow school Wi-Fi. -->
  <meta http-equiv="Cache-Control" content="public, max-age=31536000, immutable">
</head>
